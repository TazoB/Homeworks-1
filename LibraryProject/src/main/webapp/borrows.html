<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrows</title>
    <link rel="stylesheet" href="borrowStyles.css">
    <script src="borrowsJS.js"></script>
</head>

<body>
    <div id="borrowingsDiv">
        <h1>Borrowings</h1>
        <ul>
            
        </ul>
    </div>
    <br>
    <div class="addDiv">
        <h2>Borrow Book:</h2>
        <form class="addForm" action="borrows" method="post">
            <label for="bookCode">Book Code:</label>
            <input type="text" id="bookCode" name="bookCode" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" required>
            <br><br>
            <input type="submit" name="action" value="Add Borrowing">
        </form>
    </div>

    <div class="addDiv">
        <h2>Return Book:</h2>
        <form class="addForm" action="borrows" method="post">
            <label for="bookCode">Book Code:</label>
            <input type="text" id="bookCode" name="bookCode" required>
            <br><br>
            <input type="submit" name="action" value="Return Book">
        </form>

    </div>
</body>
</html>
