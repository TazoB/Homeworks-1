<!DOCTYPE html>
<html lang="en">
<head>
    <title>FreshMart Grocery Store</title>
    <meta charset="UTF-8">
</head>
<body>

<h1>Welcome to FreshMart Grocery Store</h1>

<h2>Add Product</h2>
<form action="/data" method="post">
    ID: <input type="number" name="id"><br><br>
    Name: <input type="text" name="name"><br><br>
    Price: <input type="number" step="0.01" name="price"><br><br>
    Quantity: <input type="number" name="quantity"><br><br>
    <button type="submit">Add Item</button>
</form>

<h2>Update Product</h2>
<form action="/data" method="post">
    <input type="hidden" name="_method" value="put">

    ID (required): <input type="number" name="id"><br><br>

    New Price: <input type="number" step="0.01" name="price"><br><br>

    New Quantity: <input type="number" name="quantity"><br><br>

    <button type="submit">Update Item</button>
</form>

<h2>Delete Product</h2>
<form action="/data" method="post">
    <input type="hidden" name="_method" value="delete">
    ID: <input type="number" name="id"><br><br>
    <button type="submit">Delete Item</button>
</form>
</body>
</html>
